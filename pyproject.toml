[project]
name = "aiko_chat"
version = "0.1"
readme = "ReadMe.md"
description = "Chat system built on top of Aiko Services"
requires-python = ">=3.9,<=3.14.6"

authors = [
  {name = "Andy Gelme", email = "geekscape@gmail.com"}
]

keywords = ["agents", "distributed"]

license-files = ["LICENCE"]

dependencies = [
  "aiko_services>=0.7"
]

[project.scripts]
aiko_chat = "aiko_chat.chat:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiko_chat"]
